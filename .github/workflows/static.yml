# Publishes the demo to GitHub Pages: the real web UI, answered from responses recorded on the running system
# (frontend/demo/fixtures.json). The architecture diagram is served at /diagram.
name: Deploy demo to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the web UI for the demo
        working-directory: frontend
        env:
          NEXT_PUBLIC_BASE_PATH: /DocIntel
          NEXT_PUBLIC_API_URL: https://rafi0020.github.io/DocIntel
        run: |
          npm ci
          npm run build
          node demo/inject.mjs
      - name: Assemble the site
        run: |
          mkdir _site
          cp -r frontend/out/. _site/
          mkdir _site/diagram
          cp docs/architecture.html _site/diagram/index.html
          touch _site/.nojekyll
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
